name: Build & tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pinned toolchain validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the validation contract
        run: pnpm validate

      - name: Upload navigation and command-count summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-navigation-${{ github.sha }}
          path: |
            test-results/public-navigation/**/summary.json
            test-results/command-capacity/**/summary.json
          if-no-files-found: error
          retention-days: 14

  blazor:
    name: Blazor sample validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install sample-local pinned .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: examples/blazor-wasm/global.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium and Linux dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the mandatory Blazor contract
        run: pnpm blazor:validate
